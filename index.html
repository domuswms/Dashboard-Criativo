<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadastro & Criativo · weaxis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<style>
:root{--lime:#ECFC30;--ink:#212121;--bg:#fff;--alt:#F5F5F5;--bd:#DBDBDB;--mut:#6b6b6b;--tx:#212121;--card:#F5F5F5;--bad:#b3261e;--f:"Greed Standard","Inter Tight",Inter,Helvetica,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161616;--alt:#212121;--bd:#3a3a3a;--mut:#BDBDBD;--tx:#fff;--card:#212121}}
:root[data-theme=dark]{--bg:#161616;--alt:#212121;--bd:#3a3a3a;--mut:#BDBDBD;--tx:#fff;--card:#212121}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.5 var(--f);display:flex}
aside{width:248px;flex:none;background:var(--ink);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:500;letter-spacing:-.03em;margin:0 8px 4px}
.sym{width:26px;height:26px;position:relative}.sym i{position:absolute;inset:3px 0;border-radius:50%;border:3px solid var(--lime);transform:rotate(-35deg)}.sym i+i{background:var(--lime);inset:7px 4px}
.sub{font-size:13px;color:#BDBDBD;margin:0 8px 20px}
nav button{all:unset;cursor:pointer;display:block;width:100%;padding:9px 12px;border-radius:999px;font-size:15px;color:#e8e8e8;box-sizing:border-box}
nav button:hover{background:#333}nav button.on{background:var(--lime);color:var(--ink);font-weight:500}
nav button.soon{color:#8a8a8a}nav small{font-size:11px;margin-left:6px;opacity:.7}
.sig{margin-top:auto;font-size:13px;color:#BDBDBD;padding:16px 8px 0}
main{flex:1;min-width:0;overflow:auto;padding:32px 40px 64px}
.eye{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:500}
h1{font-size:clamp(28px,3.4vw,44px);line-height:1.05;letter-spacing:-.03em;font-weight:500;margin:4px 0 20px}
mark{background:var(--lime);color:var(--ink);padding:0 .12em}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
select,input{font:inherit;font-size:14px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:8px 14px}
select:hover,input:hover{border-color:var(--tx)}
.btn{font:inherit;font-size:14px;font-weight:500;cursor:pointer;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:9px 18px}
.btn:hover{background:var(--lime);color:var(--ink)}.btn.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;box-shadow:0 0 0 5px var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:24px}
.card{background:var(--card);border-radius:14px;padding:22px}
.k{font-size:13px;color:var(--mut)}.v{font-size:40px;font-weight:500;letter-spacing:-.03em;line-height:1.1}.v.na{font-size:18px;color:var(--mut);padding-top:12px}
.h{font-size:22px;font-weight:500;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.row .t{flex:0 0 150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .b{flex:1;height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.row .b i{display:block;height:100%;background:var(--ink)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .row .b i{background:var(--lime)}}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.al{border-left:6px solid var(--lime);background:var(--card);border-radius:0 14px 14px 0;padding:12px 16px;margin:8px 0;font-size:14px}
.al.r{border-color:var(--bad)}.al a{color:inherit}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:500;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px;border-bottom:1px solid var(--bd)}
td{padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:top}td a{color:inherit}
.chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:rgba(236,252,48,.35);margin:1px 2px 1px 0;white-space:nowrap}.chip.g{background:var(--bd)}.chip.r{background:var(--bad);color:#fff}
.kan{display:flex;gap:14px;overflow-x:auto;align-items:flex-start}.col{flex:0 0 260px;background:var(--card);border-radius:14px;padding:14px}
.col h3{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:500}
.tk{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.tk a{color:inherit;font-weight:500}.tk .m{font-size:12px;color:var(--mut);margin-top:4px}
td input[type=number]{width:92px;padding:5px 8px;border-radius:8px}td input.n{width:150px}
.msg{padding:24px;border-radius:14px;background:var(--card)}.stamp{font-size:12px;color:var(--mut)}
.band{background:var(--lime);color:var(--ink);border-radius:14px;padding:28px;margin-top:28px}.band b{font-size:clamp(22px,2.6vw,32px);font-weight:500;letter-spacing:-.02em;line-height:1.1}
@media(max-width:860px){body{flex-direction:column}aside{width:auto;flex-direction:row;flex-wrap:wrap;padding:12px}.sub,.sig{display:none}nav{display:flex;flex-wrap:wrap;gap:2px}nav button{width:auto;padding:7px 12px;font-size:14px}main{padding:20px 16px 48px}.row .t{flex-basis:96px}}
.fl{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:4px}.fl input,.fl select{border-radius:10px;width:100%}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.wide{grid-column:1/-1}dialog{border:0;border-radius:14px;max-width:780px;width:92vw;max-height:90vh;overflow:auto;background:var(--bg);color:var(--tx);padding:24px}dialog::backdrop{background:rgba(0,0,0,.55)}.gt{position:relative;height:22px;background:var(--bd);border-radius:6px}.gt i{position:absolute;top:3px;bottom:3px;background:var(--ink);border-radius:4px}.gt i.f{background:var(--lime);outline:1px solid var(--ink)}tr[data-e]:hover{background:var(--card)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside>
  <div class="logo"><span class="sym"><i></i><i></i></span>weaxis</div>
  <div class="sub">Cadastro &amp; Criativo</div>
  <nav id="nav"></nav>
  <div class="sig">nós somos o eixo<br>weaxis.com</div>
</aside>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY=864e5, SRC={
  anuncios:['Anúncios (Criativo)',{list_ids:['901312757364']}],
  compras:['Compras',{list_ids:['901312319816']}],
  itajai:['Pasta Itajaí-SC',{folder_ids:['90137504399']}],
  londrina:['Pasta Londrina-PR',{folder_ids:['90137507791']}]};
const MODS=[['painel','Painel executivo'],['tarefas','Central de tarefas'],['expansao','Expansão e fornecedores'],['plano','Plano de 90 dias'],['lotes','Cadastro e pendências'],['vonder','Vonder 360'],['pops','Processos e POPs',1],['prod','Produtividade e qualidade'],['rel','Relatórios']];
let S={view:'painel',src:'anuncios',tasks:[],loaded:0,state:'idle',err:'',filial:'',resp:'',st:'',q:'',mode:'lista',forn:[],dbOk:null,plano:[],inicio:'',pm:'lista',pfase:'',edit:null,vcfg:{},vhist:[],vper:'sem',lotes:[],lf:'',ls:'',ledit:null,rp:'30',qc:{}},db=null,unsub=null;

function norm(t){const tg=(t.tags||[]).map(x=>String(x.name).toLowerCase());
  const fil=tg.some(x=>x.startsWith('itaja'))?'Itajaí':tg.some(x=>x.startsWith('londrina'))?'Londrina':'Sem filial';
  const done=!!t.date_closed||/conclu/i.test(t.status||'');
  return{id:t.id,name:t.name,status:t.status||'—',url:t.url,pri:t.priority,resp:(t.assignees||[]).map(a=>a.username).filter(Boolean),tags:tg,fil,
    due:t.due_date?+t.due_date:null,upd:+t.date_updated,closed:t.date_closed?+t.date_closed:null,done,list:t.list&&t.list.name}}

// As tarefas vêm de data/clickup.json, gerado todo dia às 7h pela rotina de coleta (ROTINA.md).
async function load(){
  S.state='loading';render();
  try{
    const r=await fetch('data/clickup.json',{cache:'no-store'});
    if(!r.ok){S.state='err';S.err=r.status===404?'sem_arquivo':'x';S.errMsg='HTTP '+r.status;return render()}
    const f=(await r.json()).fontes?.[S.src];
    if(!f){S.state='err';S.err='sem_fonte';return render()}
    S.tasks=f.tarefas.map(norm);S.loaded=f.sincronizado_em;S.state='ok';
  }catch(e){S.state='err';S.err='x';S.errMsg=e&&e.message}
  render()}

function metrics(ts){const n=Date.now(),op=ts.filter(t=>!t.done);
  return{all:ts.length,done:ts.length-op.length,op,
    late:op.filter(t=>t.due&&t.due<n),stale:op.filter(t=>n-t.upd>14*DAY),
    wait:op.filter(t=>t.tags.includes('aguardando informações')),nodue:op.filter(t=>!t.due),
    d30:ts.filter(t=>t.closed&&n-t.closed<30*DAY).length}}
const filt=ts=>ts.filter(t=>(!S.filial||t.fil===S.filial)&&(!S.resp||t.resp.includes(S.resp))&&(!S.st||t.status===S.st)&&(!S.q||(t.name+' '+t.id).toLowerCase().includes(S.q.toLowerCase())));
const fmt=ms=>ms?new Date(ms).toLocaleDateString('pt-BR'):'—';
const pct=(a,b)=>b?Math.round(a/b*100)+'%':null;
const card=(k,v,s)=>`<div class="card"><div class="k">${k}</div>${v==null?'<div class="v na">Sem dados suficientes</div>':`<div class="v">${v}</div>`}${s?`<div class="k">${s}</div>`:''}</div>`;
const bars=(arr,mx)=>arr.map(([l,c])=>`<div class="row"><span class="t" title="${esc(l)}">${esc(l)}</span><span class="b"><i style="width:${mx?c/mx*100:0}%"></i></span><b>${c}</b></div>`).join('')||'<div class="k">Sem dados suficientes</div>';
const count=(ts,f)=>{const m={};ts.forEach(t=>[].concat(f(t)).forEach(x=>m[x]=(m[x]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const alink=t=>`<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a>`;

function toolbar(withStatus){
  const ts=S.tasks,fil=[...new Set(ts.map(t=>t.fil))],rs=[...new Set(ts.flatMap(t=>t.resp))].sort(),sts=[...new Set(ts.map(t=>t.status))];
  const o=(a,v,l)=>`<option value="${esc(v)}" ${a===v?'selected':''}>${esc(l)}</option>`;
  return`<div class="bar">
  <select id="src" aria-label="Fonte">${Object.entries(SRC).map(([k,v])=>o(S.src,k,v[0])).join('')}</select>
  <select id="fil" aria-label="Filial">${o(S.filial,'','Todas as filiais')}${fil.map(f=>o(S.filial,f,f)).join('')}</select>
  <select id="resp" aria-label="Responsável">${o(S.resp,'','Todos os responsáveis')}${rs.map(f=>o(S.resp,f,f)).join('')}</select>
  ${withStatus?`<select id="st" aria-label="Status">${o(S.st,'','Todos os status')}${sts.map(f=>o(S.st,f,f)).join('')}</select><input id="q" type="search" placeholder="Buscar por nome ou ID" value="${esc(S.q)}">`:''}
  <button class="btn s" id="rf">Recarregar dados</button>
  <span class="stamp">${S.loaded?'ClickUp lido em '+new Date(S.loaded).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' · atualiza todo dia às 7h':''}</span></div>`}

function gate(){
  if(S.state==='loading'||S.state==='idle')return`<div class="msg">Carregando tarefas do ClickUp…</div>`;
  if(S.state==='err'){
    const m={sem_arquivo:'Ainda não há dados do ClickUp. O arquivo é gerado pela rotina diária das 7h.',sem_fonte:'Esta fonte ainda não está no arquivo de dados. Ela entra na próxima coleta das 7h.'}[S.err]||'Não foi possível ler os dados do ClickUp ('+esc(S.errMsg||'erro desconhecido')+'). Se a página foi aberta direto do disco, abra pelo endereço do GitHub Pages.';
    return`<div class="msg">${m}<br><br><button class="btn" id="rf2">Tentar de novo</button></div>`}
  return''}

function painel(){const g=gate();if(g)return g;
  const ts=filt(S.tasks),m=metrics(ts),n=Date.now();
  const byFil=count(ts,t=>t.fil),byStatus=count(m.op,t=>t.status),byResp=count(m.op,t=>t.resp.length?t.resp:['Sem responsável']).slice(0,8);
  const alerts=[];
  if(m.late.length)alerts.push(['r',`${m.late.length} tarefa(s) com prazo vencido`,m.late.slice(0,3)]);
  if(m.wait.length)alerts.push(['',`${m.wait.length} aguardando informações`,m.wait.slice(0,3)]);
  if(m.stale.length)alerts.push(['',`${m.stale.length} sem atualização há mais de 14 dias`,m.stale.slice(0,3)]);
  return`${toolbar(false)}<div class="grid">
  ${card('Tarefas no escopo',m.all)}${card('Em aberto',m.op.length)}${card('Concluídas',m.done,'últimos 30 dias: '+m.d30)}
  ${card('Atrasadas',m.op.length-m.nodue.length?m.late.length:null,m.nodue.length+' em aberto sem prazo definido')}
  ${card('Concluídas ÷ total',pct(m.done,m.all),'conclusão simples, sem peso')}</div>
  <div class="two"><div class="card"><div class="h">Alertas</div>${alerts.map(([c,t,l])=>`<div class="al ${c}"><b>${t}</b><br>${l.map(alink).join(' · ')}</div>`).join('')||'<div class="k">Nenhum alerta com os dados atuais.</div>'}</div>
  <div class="card"><div class="h">Em aberto por status</div>${bars(byStatus,byStatus[0]?.[1])}</div>
  <div class="card"><div class="h">Carga por responsável</div>${bars(byResp,byResp[0]?.[1])}</div>
  <div class="card"><div class="h">Por filial (tags do ClickUp)</div>${bars(byFil,byFil[0]?.[1])}<div class="k">A filial vem das tags “itajaí” e “londrina”. Tarefas sem tag ficam em “Sem filial”.</div></div></div>`}

function tarefas(){const g=gate();if(g)return g;
  const ts=filt(S.tasks).sort((a,b)=>b.upd-a.upd),n=Date.now();
  const tog=`<div class="bar"><button class="btn ${S.mode==='lista'?'':'s'}" data-mode="lista">Lista</button><button class="btn ${S.mode==='kanban'?'':'s'}" data-mode="kanban">Kanban</button><span class="stamp">${ts.length} tarefa(s)</span></div>`;
  const chips=t=>`${t.tags.map(x=>`<span class="chip g">${esc(x)}</span>`).join('')}`;
  if(S.mode==='kanban'){const cols=count(ts,t=>t.status).map(c=>c[0]);
    return toolbar(true)+tog+`<div class="kan">${cols.map(c=>{const l=ts.filter(t=>t.status===c).slice(0,40);return`<div class="col"><h3>${esc(c)} · ${ts.filter(t=>t.status===c).length}</h3>${l.map(t=>`<div class="tk">${alink(t)}<div class="m">${esc(t.resp.slice(0,3).join(', ')||'Sem responsável')}${t.resp.length>3?' +'+(t.resp.length-3):''}<br>${chips(t)}</div></div>`).join('')}</div>`}).join('')}</div>`}
  return toolbar(true)+tog+`<div class="card tw"><table><thead><tr><th>Tarefa</th><th>Status</th><th>Responsáveis</th><th>Filial</th><th>Prazo</th><th>Parada há</th><th>Tags</th></tr></thead><tbody>${ts.slice(0,300).map(t=>{const late=!t.done&&t.due&&t.due<n;return`<tr><td>${alink(t)}<br><span class="stamp">${esc(t.id)}</span></td><td><span class="chip ${t.done?'g':''}">${esc(t.status)}</span></td><td>${esc(t.resp.join(', ')||'—')}</td><td>${t.fil}</td><td>${t.due?`<span class="chip ${late?'r':'g'}">${fmt(t.due)}</span>`:'<span class="stamp">sem prazo</span>'}</td><td>${t.done?'—':Math.floor((n-t.upd)/DAY)+' d'}</td><td>${chips(t)}</td></tr>`}).join('')}</tbody></table></div>`}

const NUM=['total','validado','elegivel','priorizado','erp','publicado'];
const LAB={total:'Informado',validado:'Validado',elegivel:'Elegível',priorizado:'Priorizado',erp:'No ERP',publicado:'Publicado'};
function expansao(){
  if(S.dbOk===false)return`<div class="msg">O armazenamento da página não está disponível para você. Peça acesso de edição ao dono do dashboard.</div>`;
  const F=S.forn.filter(f=>!S.filial||f.filial===S.filial);
  const covOf=f=>f.elegivel>0&&f.publicado!=null?Math.round(f.publicado/f.elegivel*100):null;
  const sum=k=>F.reduce((a,f)=>a+(+f[k]||0),0);
  const fun=NUM.map(k=>[LAB[k],sum(k)]);
  return`<div class="bar"><select id="fil">${['','Itajaí','Londrina'].map(v=>`<option value="${v}" ${S.filial===v?'selected':''}>${v||'Todas as filiais'}</option>`).join('')}</select>
  <input id="nf" class="n" placeholder="Novo fornecedor"><button class="btn" id="add">Adicionar</button>${S.forn.length?'':'<button class="btn s" id="seed">Carregar fornecedores iniciais</button>'}</div>
  <div class="two"><div class="card"><div class="h">Funil do catálogo</div>${bars(fun,Math.max(...fun.map(x=>x[1]),0))}<div class="k">Cobertura = publicados ÷ elegíveis validados. Catálogo bruto não entra na conta.</div></div>
  <div class="card"><div class="h">Como ler</div><div class="k">Preencha só o que foi confirmado. Campo vazio aparece como “Sem dados suficientes”, nunca como zero. Os 16.000 SKUs da Vonder são referência inicial a validar.</div></div></div>
  <div class="card tw" style="margin-top:16px"><table><thead><tr><th>Fornecedor</th><th>Filial</th><th>Modelo</th>${NUM.map(k=>`<th>${LAB[k]}</th>`).join('')}<th>Cobertura</th></tr></thead><tbody>${F.map(f=>{const c=covOf(f);return`<tr><td><b>${esc(f.nome)}</b></td><td><select data-f="${f.id}" data-k="filial">${['Itajaí','Londrina'].map(v=>`<option ${f.filial===v?'selected':''}>${v}</option>`).join('')}</select></td><td><select data-f="${f.id}" data-k="modelo">${['A definir','Cross-docking','Dropshipping','Estoque próprio'].map(v=>`<option ${f.modelo===v?'selected':''}>${v}</option>`).join('')}</select></td>${NUM.map(k=>`<td><input type="number" min="0" data-f="${f.id}" data-k="${k}" value="${f[k]??''}"></td>`).join('')}<td>${c==null?'<span class="stamp">Sem dados suficientes</span>':`<b>${c}%</b><div class="row"><span class="b"><i style="width:${Math.min(c,100)}%"></i></span></div>`}</td></tr>`}).join('')||`<tr><td colspan="10" class="stamp">Nenhum fornecedor ainda. Adicione um ou carregue a lista inicial.</td></tr>`}</tbody></table></div>`}

const ST=['Não iniciada','Planejada','Em andamento','Aguardando informações','Aguardando outro departamento','Bloqueada','Em revisão','Concluída','Cancelada'];
const FASES=['Fase 1 · Diagnóstico e organização (dias 1–30)','Fase 2 · Padronização e implementação (dias 31–60)','Fase 3 · Consolidação e avaliação (dias 61–90)'];
const SEEDP=[[0,'Mapear processos atuais'],[0,'Identificar gargalos'],[0,'Levantar pendências'],[0,'Definir responsáveis'],[0,'Organizar prioridades'],[0,'Criar linha de base dos indicadores'],[1,'Desenvolver POPs'],[1,'Implantar checklists'],[1,'Estruturar fluxo com Compras e centro de distribuição'],[1,'Criar controles operacionais'],[1,'Iniciar projetos prioritários de expansão'],[2,'Validar processos'],[2,'Acompanhar resultados'],[2,'Corrigir gargalos'],[2,'Analisar indicadores'],[2,'Apresentar resultados à diretoria']];
const LBL={status:'Status',pct:'% conclusão',fim:'Prazo',resp:'Responsável',ini:'Início planejado'};
const pd=s=>s?new Date(s+'T00:00:00').getTime():null,hoje=()=>new Date().toISOString().slice(0,10);
const isOpen=x=>!['Concluída','Cancelada'].includes(x.status);
const late=x=>isOpen(x)&&x.fim&&pd(x.fim)<pd(hoje());
function pstats(L){const a=L.filter(x=>x.status!=='Cancelada'),w=a.reduce((s,x)=>s+(+x.peso||1),0),p=a.reduce((s,x)=>s+(x.status==='Concluída'?100:(+x.pct||0))*(+x.peso||1),0);
  return{n:a.length,done:a.filter(x=>x.status==='Concluída').length,pw:w?Math.round(p/w):null}}
function plano(){
  if(S.dbOk===false)return`<div class="msg">O armazenamento da página não está disponível para você. Peça acesso de edição ao dono do dashboard.</div>`;
  const all=[...S.plano].sort((a,b)=>a.fase-b.fase||String(a.codigo).localeCompare(String(b.codigo),'pt',{numeric:true}));

  ${t('Pendências por departamento',bars(de,(de[0]||[])[1]))}
  ${t('Vonder',V?`<div class="row"><span class="t">Publicados</span><b>${nf(V.publicado)??'Sem dados suficientes'}</b></div><div class="row"><span class="t">Cobertura</span><b>${V.elegivel>0&&V.publicado!=null?Math.round(V.publicado/V.elegivel*1000)/10+'%':'Sem dados suficientes'}</b></div><div class="row"><span class="t">Última variação</span><b>${last&&prev&&last.publicado!=null&&prev.publicado!=null?(last.publicado-prev.publicado>0?'+':'')+nf(last.publicado-prev.publicado)+' ('+prev.id+' → '+last.id+')':'Sem dados suficientes'}</b></div>`:'<div class="k">Sem dados suficientes.</div>')}
  ${t('Expansão por fornecedor',S.forn.length?`<div class="tw"><table>${S.forn.filter(f=>f.elegivel>0&&f.publicado!=null).map(f=>`<tr><td>${esc(f.nome)}</td><td>${Math.round(f.publicado/f.elegivel*100)}%</td></tr>`).join('')||'<tr><td class="stamp">Sem dados suficientes</td></tr>'}</table></div>`:'<div class="k">Sem dados suficientes.</div>')}
  ${t('Documentação concluída','<div class="k">Sem dados suficientes: o módulo de POPs ainda não foi implantado.</div>')}</div>
  <div class="two" style="margin-top:16px">${t('Principais riscos',risk.map(([c,x])=>`<div class="al ${c}">${x}</div>`).join('')||'<div class="k">Nenhum risco com os dados atuais.</div>')}${t('Decisões pendentes da gestão',dec.map(x=>`<div class="al">${esc(x)}</div>`).join('')||'<div class="k">Nenhuma.</div>')}</div>`}
document.addEventListener('click',e=>{const k=e.target.dataset.exp;if(k)dl(k,EXP[k]())});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='rp'){S.rp=t.value;render()}
  else if(t.dataset.q&&db)db.doc('config/prod').set({...S.qc,[t.dataset.q]:t.value===''?null:+t.value}).catch(()=>{});
  else if(t.dataset.qp&&db)db.doc('config/prod').set({...S.qc,pesos:{...(S.qc.pesos||{}),[t.dataset.qp]:t.value===''?null:+t.value}}).catch(()=>{})});
function soon(t){return`<div class="band"><b>${esc(t)}</b><br>Entra na próxima etapa, no mesmo padrão de rastreabilidade.</div>`}
function render(){
  $('#nav').innerHTML=MODS.map(([k,l,s])=>`<button data-v="${k}" class="${S.view===k?'on':''} ${s?'soon':''}">${l}${s?'<small>em breve</small>':''}</button>`).join('');
  const T={painel:['Painel executivo','Sua operação,<br><mark>num só eixo.</mark>'],tarefas:['Central de tarefas','Quem faz, <mark>até quando.</mark>'],expansao:['Expansão comercial','Do catálogo <mark>à publicação.</mark>'],plano:['Plano de reestruturação','Noventa dias, <mark>um eixo.</mark>'],vonder:['Vonder 360','Do catálogo <mark>ao anúncio.</mark>'],lotes:['Cadastro e pendências','Cada lote, <mark>sem ponto cego.</mark>'],prod:['Produtividade e qualidade','Volume <mark>sem perder qualidade.</mark>'],rel:['Relatórios','O que está acontecendo, <mark>em uma tela.</mark>']}[S.view]||[MODS.find(m=>m[0]===S.view)[1],'Em construção'];
  const body=S.view==='painel'?painel():S.view==='tarefas'?tarefas():S.view==='expansao'?expansao():S.view==='plano'?plano():S.view==='vonder'?vonder():S.view==='lotes'?lotes():S.view==='prod'?prod():S.view==='rel'?rel():soon(T[0]);
  $('#main').innerHTML=`<div class="eye">${T[0]}</div><h1>${T[1]}</h1>${body}`}

document.addEventListener('click',e=>{const t=e.target;
  if(t.dataset.v){S.view=t.dataset.v;render()}
  if(t.dataset.mode){S.mode=t.dataset.mode;render()}
  if(t.id==='rf'||t.id==='rf2')load();
  if(t.id==='add'){const v=$('#nf').value.trim();v&&addF(v)}
  if(t.id==='seed')seed()});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='src'){S.src=t.value;load()}
  else if(t.id==='fil'){S.filial=t.value;render()}
  else if(t.id==='resp'){S.resp=t.value;render()}
  else if(t.id==='st'){S.st=t.value;render()}
  else if(t.dataset.f&&db){const v=t.type==='number'?(t.value===''?null:+t.value):t.value;db.collection('fornecedores').doc(t.dataset.f).set({...S.forn.find(f=>f.id===t.dataset.f),[t.dataset.k]:v,atualizado:Date.now()}).catch(()=>{})}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});

function addF(nome,extra){if(!db)return;const r=db.collection('fornecedores').doc();const {id,...rest}=extra||{};return r.set({nome,filial:'Itajaí',modelo:'A definir',...rest,criado:Date.now()}).catch(()=>{})}
function seed(){[['Vonder','Itajaí','A definir',{total:16000,erp:2000}],['Fratini','Itajaí','Dropshipping'],['Work','Itajaí','Cross-docking'],['Kala','Itajaí','Cross-docking'],['Pulse','Itajaí'],['DJI','Itajaí'],['Toshiba','Itajaí'],['Multi Kids','Itajaí'],['Litet','Itajaí'],['Fisher-Price','Itajaí'],['Chico Brinquedos','Itajaí'],['Cortag','Itajaí'],['Mondial','Itajaí'],['Colibri','Londrina','Cross-docking'],['DJ Móveis','Londrina']].forEach(([n,f,m,x])=>addF(n,{filial:f,modelo:m||'A definir',...(x||{})}))}

(async()=>{render();
  try{db=await claude.use('db');
    if(db){db.collection('fornecedores').onSnapshot(s=>{S.forn=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.nome.localeCompare(b.nome));S.dbOk=true;if(S.view==='expansao'&&!document.activeElement.matches('input,select'))render()},()=>{S.dbOk=false});db.collection('plano').onSnapshot(q=>{S.plano=q.docs.map(d=>({id:d.id,...d.data()}));if(S.view==='plano'&&!S.edit)render()},()=>{});db.doc('config/prod').onSnapshot(d=>{S.qc=(d.exists&&d.data())||{};if((S.view==='prod')&&!document.activeElement.matches('input'))render()},()=>{});db.collection('lotes').onSnapshot(q=>{S.lotes=q.docs.map(d=>({id:d.id,...d.data()}));if((S.view==='lotes'&&!S.ledit)||S.view==='rel'||S.view==='prod')render()},()=>{});db.collection('vonder_hist').onSnapshot(q=>{S.vhist=q.docs.map(d=>({id:d.id,...d.data()}));if(S.view==='vonder')render()},()=>{});db.doc('config/vonder').onSnapshot(d=>{S.vcfg=(d.exists&&d.data())||{};if(S.view==='vonder'&&!document.activeElement.matches('input'))render()},()=>{});db.doc('config/plano').onSnapshot(d=>{S.inicio=(d.exists&&d.data().inicio)||'';if(S.view==='plano'&&!S.edit)render()},()=>{})}else S.dbOk=false}catch(e){S.dbOk=false}
  load()})();
</script>
</body>
</html>
